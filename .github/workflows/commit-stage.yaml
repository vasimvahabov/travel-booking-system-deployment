name: Commit Stage
on: push

env:
  VERSION: ${{ github.sha }}

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4
      - name: Setup Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          kubectl: '1.24.10'
          kubeconform: '0.5.0'
          helm: '3.11.1'
      - name: Validate manifests
        run: |
          kubeconform -strict -verbose k8s/manifests
      - name: Validate Helm Charts
        run: |
          set -ex
          for chart in k8s/charts/*;
            do
              echo "Rebuild charts by installing dependencies ..."
              helm dependency update "$chart"

              echo "Checking for missing dependencies"
              if helm dependency list "$chart" | grep -q missing; then
                echo "Missing dependencies detected ..."
                exit 1
              fi

              echo "Validating charts with kubeconform ..."
              helm template "${{ env.VERSION }}" "$chart" | kubeconform -verbose -ignore-missing-schemas
            done
