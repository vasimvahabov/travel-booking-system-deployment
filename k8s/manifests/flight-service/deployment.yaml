apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: travel-booking-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      name: flight-service
      labels:
        app: flight-service
    spec:
      containers:
        - name: flight-service
          imagePullPolicy: IfNotPresent
          image: ghcr.io/vasimvahabov/flight-service:0.5.0
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          env:
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres/flights"
            - name: JWT_ISSUER_URI
              value: http://keycloak:4455/realms/travel-booking-system
          ports:
            - containerPort: 8899
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              port: 8899
              path: /actuator/health/liveness
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 15
            httpGet:
              port: 8899
              path: /actuator/health/readiness
