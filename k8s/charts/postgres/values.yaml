replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent

service:
  port: 5432
  targetPort: 5432
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 60Mi
  limits:
    cpu: 200m
    memory: 120Mi

volumeMounts:
  - mountPath: /docker-entrypoint-initdb.d
    name: postgres-init

volumes:
  - name: postgres-init
    configMap:
      name: postgres-init
