replicaCount: 1

image:
  repository: keycloak/keycloak
  pullPolicy: IfNotPresent

service:
  port: 8080
  targetPort: 8080
  type: ClusterIP

args:
  - "start-dev"
  - "--import-realm"

env:
  - name: KC_HOSTNAME
    value: keycloak
  - name: KC_HTTP_PORT
    value: "8080"

resources:
  requests:
    cpu: 100m
    memory: 350Mi
  limits:
    cpu: 500m
    memory: 750Mi

volumeMounts:
  - name: keycloak-config
    mountPath: /opt/keycloak/conf/
  - name: keycloak-realm
    mountPath: /opt/keycloak/data/import

volumes:
  - name: keycloak-config
    configMap:
      name: keycloak-config
  - name: keycloak-realm
    configMap:
      name: keycloak-realm
