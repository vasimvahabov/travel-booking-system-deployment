apiVersion: 1

deleteDatasources:
  - name: Loki
  - name: Prometheus
  - name: Tempo

datasources:
  - name: Loki
    type: loki
    uid: loki
    orgId: 1
    access: proxy
    url: 'http://loki:3100'
    basicAuth: false
    isDefault: true
    editable: true
    version: 1
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: \[.+,(.+?),
          name: TraceID
          url: '$${__value.raw}'
  - name: Tempo
    type: tempo
    uid: tempo
    orgId: 1
    access: proxy
    url: 'http://tempo:3200'
    basicAuth: false
    isDefault: false
    editable: true
    version: 1
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags: [ 'job', 'instance', 'pod', 'namespace' ]
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
    serviceMap:
      datasourceUid: prometheus
    nodeGraph:
      enabled: true
    search:
      hide: false
  - name: Prometheus
    type: prometheus
    uid: prometheus
    orgId: 1
    access: proxy
    url: 'http://prometheus:9090'
    basicAuth: false
    isDefault: false
    editable: true
    version: 1
