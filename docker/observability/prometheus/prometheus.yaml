global:
  scrape_interval: 2s

scrape_configs:
  - job_name: flight-service
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['flight-service:8001']
  - job_name: flight-booking-service
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['flight-booking-service:8002']
  - job_name: edge-service
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['edge-service:8003']
  - job_name: payment-service
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:`8004']
  - job_name: config-service
    scrape_interval: 2s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-service:8005']
