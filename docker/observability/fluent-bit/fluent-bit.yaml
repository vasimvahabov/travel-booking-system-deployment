pipeline:
  inputs:
    - name: forward
      listen: 0.0.0.0
      port: 24224

  outputs:
    - name: loki
      match: '*'
      remove_keys: source, container_id
      host: ${LOKI_HOST}
      port: 3100
      labels: job=fluent-bit
      label_keys: $container_name
      line_format: json
      log_level: info
